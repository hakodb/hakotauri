[package]
name = "hakotauri"
version = "0.2.0"
edition = "2021"
description = "Tauri gateway commands for the HakoDB embedded document engine"
license = "MIT"

[lib]
name = "hakotauri"
path = "src/lib.rs"

[dependencies]
# Sync features on: the net_sync/cloud_sync command modules drive them, so
# consumers register SDK commands instead of using hakodb directly.
hakodb = { version = "0.8.23", default-features = false, features = ["net-sync", "cloud-sync"] }
tauri = { version = "=2.10.3" }
# Pinned as a triple: the in-tree gateway build was green on exactly
# tauri 2.10.3 + macros 2.5.5 + runtime 2.10.1. Newer macros (2.6.x)
# emit a doubled #[macro_export] that rustc rejects with E0255, and a
# newer runtime breaks tauri 2.10.3 (Send vs Send+Sync drift).
tauri-macros = { version = "=2.5.5" }
tauri-runtime = { version = "=2.10.1" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
rayon = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
