[package]
name = "hakotauri"
version = "0.3.0"
edition = "2021"
description = "Tauri gateway commands for the HakoDB embedded document engine"
license = "MIT"

[lib]
name = "hakotauri"
path = "src/lib.rs"

[dependencies]
# Sync features on: the net_sync/cloud_sync command modules drive them, so
# consumers register SDK commands instead of using hakodb directly.
hakodb = { version = "0.8.23", default-features = false, features = ["net-sync", "cloud-sync"] }
tauri = { version = "2.11" }
# Formerly pinned as a triple (=2.10.3/=2.5.5/=2.10.1) because macros 2.6.x
# emitted a doubled #[macro_export] (E0255) against tauri 2.10.3. Re-test
# before re-pinning: match the consumer line (kastoko: tauri 2.11.5,
# macros 2.6.3, runtime 2.11.3) so one tauri version serves the binary.
tauri-macros = { version = "2.6" }
tauri-runtime = { version = "2.11" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
rayon = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
